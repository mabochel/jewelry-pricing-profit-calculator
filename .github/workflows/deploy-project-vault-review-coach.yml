name: Deploy Project Vault Review Coach

on:
  push:
    branches:
      - docs-review-coach
    paths:
      - 'project-vault-review-coach/**'
      - '.github/workflows/deploy-project-vault-review-coach.yml'
  workflow_dispatch:

permissions:
  contents: read

